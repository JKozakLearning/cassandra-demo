services:
  cassandra-1:
    image: cassandra:5.0
    container_name: cassandra-1
    hostname: cassandra-1
    environment:
      CASSANDRA_CLUSTER_NAME: QuorumDemo
      CASSANDRA_DC: dc1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_SEEDS: cassandra-1
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 256M
    mem_limit: 2g
    ports:
      - "127.0.0.1:9042:9042"
    volumes:
      - cassandra1_data:/var/lib/cassandra
    networks: [cassandra]
    healthcheck:
      test: ["CMD-SHELL", "cqlsh 127.0.0.1 9042 -e 'SELECT release_version FROM system.local' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 90s

  cassandra-2:
    image: cassandra:5.0
    container_name: cassandra-2
    hostname: cassandra-2
    environment:
      CASSANDRA_CLUSTER_NAME: QuorumDemo
      CASSANDRA_DC: dc1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_SEEDS: cassandra-1
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 256M
    mem_limit: 2g
    volumes:
      - cassandra2_data:/var/lib/cassandra
    networks: [cassandra]
    healthcheck:
      test: ["CMD-SHELL", "cqlsh 127.0.0.1 9042 -e 'SELECT release_version FROM system.local' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 90s
    depends_on:
      cassandra-1:
        condition: service_healthy

  cassandra-3:
    image: cassandra:5.0
    container_name: cassandra-3
    hostname: cassandra-3
    environment:
      CASSANDRA_CLUSTER_NAME: QuorumDemo
      CASSANDRA_DC: dc1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_SEEDS: cassandra-1
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 256M
    mem_limit: 2g
    volumes:
      - cassandra3_data:/var/lib/cassandra
    networks: [cassandra]
    healthcheck:
      test: ["CMD-SHELL", "cqlsh 127.0.0.1 9042 -e 'SELECT release_version FROM system.local' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 90s
    depends_on:
      cassandra-2:
        condition: service_healthy

networks:
  cassandra:
    driver: bridge
volumes:
  cassandra1_data:
  cassandra2_data:
  cassandra3_data:
